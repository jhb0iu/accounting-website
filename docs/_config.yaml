# 1. This is the root object of the config. It is made up of a number of sub-objects.
base: /

# 2. Set the HTML title for the website. This will be added to all pages unless overridden in the frontmatter.
title: 简财云 — 让财务管理回归简单

# 3. Set the directory where generated files are placed.
out_dir: .

# 4. Site metadata. These are used to generate the feed.json and RSS/Atom.xml file, as well as being used by search engines via og tags and robots.txt directives.
author: JHB
description: >-
  简财云 - 个人财务、团队财务一站式管理，费用追踪、预算控制、智能报表，让每一分钱都有据可查。

# 5. Set the base URL for the site.
url: "https://jhbu0iu.github.io/"

# 6. The following config is used by feed.json + Open Graph links.
#   - A title is required and is used in the feed name and Open Graph article titles.
#   - An image is used as the thumbnail in the feed and Open Graph data.
#   - A category is used to set the feed's default language setting.
#   - A summary is used to provide additional context on the feed or Open Graph data.
feed:
  image: https://github.com/jhb0iu/accounting-website/raw/main/public/favicon.ico

# 7. Configure the site's date format. This applies to all pages without an explicit date format override in their frontmatter.
date_format: "yyyy-MM-dd"

# 8. The languages used on the site. This is used to generate the default sitemap URLs.
languages:
  - en

# 9. Options for the static website generator.
options:
  # Whether to include timestamps in URLs. When set to true, the timestamp is included in the URL.
  include_timestamp: false
  # Base for relative URLs.
  relative_assets: true
